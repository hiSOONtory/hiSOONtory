<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1968, 세 도시의 학생</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 1968, 세 도시의 학생 — 1968은 판화 포스터, 2026은 밝은 현대 UI */
:root {
  --paper: #efe6d0;
  --ink: #17140f;
  --accent: #d7261e;
  --fs: clamp(16px, 1.75vw, 26px);
  --title-font: 'Black Han Sans', 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
}
[data-city="PA"] { --accent: #d7261e; }
[data-city="PR"] { --accent: #1f4fa3; }
[data-city="MX"] { --accent: #1e7a46; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'IBM Plex Sans KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  font-size: var(--fs);
  line-height: 1.5;
  color: var(--ink);
  background: var(--ink);
  word-break: keep-all;
}
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid #ffb400; outline-offset: 2px; }
#app { height: 100vh; height: 100dvh; position: relative; overflow: hidden; }
.screen { height: 100%; }

/* ── 타이틀 ── */
#title {
  display: grid; place-items: center; padding: 16px;
  background: radial-gradient(#0002 1px, transparent 1.5px) 0 0 / 7px 7px, var(--paper);
}
.title-poster { text-align: center; max-width: 720px; }
.title-kicker { margin: 0; font-size: .8em; letter-spacing: .2em; }
.title-poster h1 { margin: .1em 0 .2em; font-family: var(--title-font); font-weight: 400; line-height: 1; }
.title-year { display: block; font-size: clamp(90px, 22vw, 260px); color: #d7261e; text-shadow: .035em .035em 0 var(--ink); }
.title-sub { display: block; font-size: clamp(30px, 6vw, 72px); }
.title-cities { display: flex; justify-content: center; gap: .5em; margin: .8em 0 1.2em; }
.title-cities b { padding: .1em .7em; color: var(--paper); background: var(--accent); }
.title-buttons { display: flex; justify-content: center; gap: .8em; flex-wrap: wrap; }
.btn-poster {
  padding: .5em 1.6em; font-family: var(--title-font); font-size: 1.3em;
  color: var(--paper); background: var(--ink); border: 3px solid var(--ink); box-shadow: 5px 5px 0 #d7261e;
}
.btn-poster.ghost { color: var(--ink); background: var(--paper); }
.btn-poster:hover { transform: translate(-2px, -2px); }
.title-note { margin: 1.6em 0 .3em; font-size: .7em; opacity: .7; }
.title-data { font-size: .7em; }

/* ── 플레이 공통 ── */
#play { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
#topbar { display: flex; align-items: center; gap: 1em; padding: .35em .8em; font-size: .68em; }
#caption { flex: 1; text-align: center; font-weight: 700; font-size: 1.15em; }
#progress { opacity: .75; white-space: nowrap; }
.topbar-buttons { display: flex; gap: .5em; white-space: nowrap; }
#topbar button { padding: .25em .8em; background: none; border: 1.5px solid currentColor; border-radius: 3px; }
#stage { position: relative; overflow: hidden; }
#stage.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

#dialog {
  position: relative; margin: .9em 1em 1em; padding: .9em 1.2em .7em;
  min-height: calc(3em + 1.6em + 6px); cursor: pointer; user-select: none;
}
#speaker { position: absolute; top: -.95em; left: 1em; padding: .05em .9em; font-size: .82em; font-weight: 700; }
#text { margin: 0; max-width: 46em; white-space: pre-wrap; }
#more { position: absolute; right: .9em; bottom: .4em; font-size: .7em; animation: bob 1s infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }
#dialog[data-kind="thought"] #text { font-style: italic; }
#dialog.ph #text { opacity: .55; font-family: ui-monospace, 'D2Coding', monospace; font-size: .88em; }
#dialog.ph { border-style: dashed !important; }

/* ── 1968: 판화 포스터 ── */
[data-era="1968"] #play { background: var(--ink); }
[data-era="1968"] #topbar { color: var(--paper); }
#bg {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: radial-gradient(#0003 1.2px, transparent 1.8px) 0 0 / 8px 8px, var(--paper) center / cover no-repeat;
}
#bg::before { /* 큰 원색 원 */
  content: ''; position: absolute; width: 38vmin; aspect-ratio: 1; border-radius: 50%; background: var(--accent);
  top: 9%; left: 62%;
}
#bg::after { /* 먹색 덩어리(건물·지면) */
  content: ''; position: absolute; inset: auto 0 0 0; height: 46%; background: var(--ink);
  clip-path: polygon(0 38%, 9% 38%, 9% 12%, 22% 12%, 22% 30%, 34% 30%, 34% 0, 47% 0, 47% 26%, 61% 26%, 61% 14%, 74% 14%, 74% 34%, 88% 34%, 88% 8%, 100% 8%, 100% 100%, 0 100%);
}
#bg[data-v="1"]::before { left: 12%; top: 14%; }
#bg[data-v="1"]::after { clip-path: polygon(0 20%, 14% 20%, 14% 0, 30% 0, 30% 34%, 52% 34%, 52% 18%, 70% 18%, 70% 40%, 100% 40%, 100% 100%, 0 100%); }
#bg[data-v="2"]::before { left: 40%; top: 5%; }
#bg[data-v="2"]::after { clip-path: polygon(0 44%, 20% 30%, 38% 40%, 55% 10%, 72% 36%, 86% 24%, 100% 42%, 100% 100%, 0 100%); }
#bg[style*="url"]::before, #bg[style*="url"]::after { display: none; }
#bg-label {
  position: relative; z-index: 1; place-self: start; margin: .6em; padding: .1em .8em;
  font: .62em ui-monospace, monospace; background: var(--paper); border: 1.5px dashed var(--ink);
}
#chars { position: absolute; inset: auto 0 0 0; height: 74%; display: flex; justify-content: space-evenly; align-items: flex-end; pointer-events: none; }
.char { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; opacity: .55; transition: opacity .2s, transform .2s; }
.char.speaking { opacity: 1; transform: translateY(-2%); }
.char .sil { height: 86%; aspect-ratio: 100 / 130; }
.sil svg, .sil img { width: 100%; height: 100%; display: block; object-fit: contain; object-position: bottom; }
.char svg { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
.char.speaking span { background: var(--accent); }
.char span { margin-bottom: .3em; padding: 0 .7em; font-size: .7em; font-weight: 700; color: var(--paper); background: var(--ink); border: 1.5px solid var(--paper); }

[data-era="1968"] #dialog { background: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--accent); }
[data-era="1968"] #speaker { color: var(--paper); background: var(--ink); }
[data-era="1968"] #dialog[data-kind="thought"] #text { color: #5b4a3a; }

#choices {
  position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: .6em; padding: 1em; background: #17140fa8;
}
#choices .prompt { margin: 0 0 .2em; padding: .1em 1em; font-weight: 700; color: var(--paper); background: var(--ink); }
#choices button {
  width: min(92%, 30em); padding: .55em 1em; text-align: left;
  background: var(--paper); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--accent);
}
#choices button:hover, #choices button:focus-visible { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--accent); }
#choices b { display: inline-block; min-width: 1.5em; margin-right: .6em; text-align: center; color: var(--paper); background: var(--ink); }
#choices.many { display: grid; grid-template-columns: repeat(2, minmax(0, 20em)); align-content: center; justify-content: center; }
#choices.many .prompt { grid-column: 1 / -1; justify-self: center; }
#choices.many button { width: 100%; }

#inspect { position: absolute; inset: 0; z-index: 2; }
.inspect-head { position: absolute; top: .6em; left: 50%; transform: translateX(-50%); margin: 0; padding: .1em 1em; font-size: .8em; font-weight: 700; color: var(--paper); background: var(--ink); white-space: nowrap; }
.spot {
  position: absolute; transform: translate(-50%, -50%); padding: .3em .9em; font-size: .85em; font-weight: 700;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 2em; box-shadow: 0 0 0 6px #efe6d066;
}
.spot::before { content: '● '; color: var(--accent); }
.spot.seen { opacity: .6; box-shadow: none; }
.spot.seen::before { content: '✓ '; }
.inspect-next { position: absolute; right: 1em; bottom: 1em; padding: .3em 1.4em; font-weight: 700; background: var(--paper); border: 3px solid var(--ink); }
.inspect-next.ready { color: var(--paper); background: var(--accent); }
.compare { position: absolute; inset: 12% 4% 6%; display: grid; grid-template-columns: 1fr 1fr; gap: 3%; }
.compare div { padding: .4em; font-size: .7em; font-weight: 700; text-align: center; background: var(--paper); border: 3px solid var(--ink); }

/* ── 2026: 밝은 현대 UI ── */
[data-era="2026"] #play { color: #1c2330; background: #eef1f6; }
[data-era="2026"] #topbar { background: #fff; border-bottom: 1px solid #d9dee7; }
[data-era="2026"] #topbar button { border-color: #c5ccd8; border-radius: 999px; }
#call { position: absolute; inset: 0; display: grid; grid-template-columns: 1.35fr 1fr; gap: 1em; padding: 1em 1em .2em; }
#call-video {
  position: relative; display: grid; place-items: end center; overflow: hidden; border-radius: 18px;
  background: linear-gradient(160deg, #3b4658, #1d2430); border: 3px solid transparent; transition: border-color .2s;
}
#call-video.speaking { border-color: #2f6df6; }
#call-face { height: 82%; aspect-ratio: 100 / 130; }
#call-face svg { fill: #8d99ad; }
.call-live { position: absolute; top: .8em; left: 1em; font-size: .62em; color: #7dffa8; }
#call-name { position: absolute; left: 1em; bottom: .8em; padding: .1em .8em; font-size: .7em; color: #fff; background: #0008; border-radius: 6px; }
#call-side { display: flex; flex-direction: column; gap: .8em; min-height: 0; }
#rec { padding: .8em 1em; background: #fff; border-radius: 14px; box-shadow: 0 2px 10px #1c233014; }
#rec-label { font-size: .65em; color: #d92d20; font-weight: 700; }
#rec-label::before { content: '● '; }
#wave { display: flex; align-items: center; gap: 3px; height: 2.6em; margin-bottom: .2em; }
#wave i { flex: 1; height: 100%; background: #2f6df6; border-radius: 2px; transform: scaleY(.25); animation: wave .9s ease-in-out infinite; }
@keyframes wave { 50% { transform: scaleY(1); } }
#questions { display: flex; flex-direction: column; gap: .6em; overflow: auto; }
#questions:not(:empty)::before { content: '질문을 골라 주세요'; font-size: .65em; color: #5a6578; }
#questions button { padding: .6em 1em; text-align: left; background: #fff; border: 2px solid #2f6df6; border-radius: 12px; }
#questions button:hover { background: #eaf1ff; }
[data-era="2026"] #dialog { background: #fff; border: 1px solid #d9dee7; border-radius: 14px; box-shadow: 0 4px 18px #1c23301a; }
[data-era="2026"] #speaker { color: #fff; background: #2f6df6; border-radius: 999px; }

/* ── 모달: 사료 카드, 수첩, 지난 대사, 이유 태그 ── */
#modal { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: 1em; background: #0009; }
#modal-box { position: relative; width: min(100%, 34em); max-height: 100%; overflow: auto; padding: 1.2em; background: #fff; border-radius: 10px; }
#modal-box.source { background: #d8ceb6; border-radius: 0; }
#modal-box h2 { margin: 0 0 .6em; font-size: 1.05em; }
.modal-close { position: sticky; bottom: 0; float: right; margin-top: .6em; padding: .2em 1.2em; background: #fff; border: 2px solid var(--ink); }
.modal-ok { display: block; margin: .9em auto 0; padding: .35em 1.6em; font-weight: 700; color: var(--paper); background: var(--ink); border: 0; }
.card { margin-bottom: .7em; padding: 1em 1.2em; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--accent); }
.card-kicker { display: flex; gap: .6em; font-size: .68em; font-weight: 700; letter-spacing: .2em; }
.card-kicker b { letter-spacing: 0; color: #a11; }
.card-text { margin: .4em 0; font-size: 1.05em; font-weight: 700; }
.card.pending .card-text { font-weight: 400; font-family: ui-monospace, monospace; font-size: .85em; }
.card.pending { border-style: dashed; }
.card-desc, .card-cite { margin: .2em 0 0; font-size: .7em; }
.card-cite { opacity: .7; }
.list .log { margin: .35em 0; font-size: .85em; }
.list .log b { margin-right: .6em; }
.empty { opacity: .6; }
.reason { text-align: center; }
.tags { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6em; }
.tags button { padding: .6em 0; background: #f3f5f9; border: 2px solid #1c2330; border-radius: 8px; font-weight: 700; }
.tags button:hover { background: #1c2330; color: #fff; }

/* ── 끝 화면(최소판) ── */
#end { display: grid; place-items: center; padding: 1em; overflow: auto; background: #eef1f6; }
.end-card { max-width: 40em; padding: 1.4em; font-size: .8em; background: #fff; border-radius: 14px; }
.end-card table { width: 100%; border-collapse: collapse; }
.end-card th, .end-card td { padding: .4em .6em; text-align: left; vertical-align: top; border-bottom: 1px solid #d9dee7; }
.btn-modern { margin-top: .6em; padding: .4em 1.6em; color: #fff; background: #2f6df6; border: 0; border-radius: 999px; }

/* ── 시대 전환·암전 ── */
#fx { position: absolute; inset: 0; z-index: 20; pointer-events: none; opacity: 0; }
#fx.noise { opacity: 1; background: repeating-linear-gradient(0deg, #fff 0 2px, #bbb 2px 3px, #222 3px 5px); animation: noise .7s steps(6); }
@keyframes noise { 0% { opacity: 0; } 30%, 70% { opacity: 1; background-position: 0 7px; } 50% { background-position: 0 -11px; } 100% { opacity: 0; } }
#fx.dark { opacity: 1; background: #000; transition: opacity .6s; }

@media (max-aspect-ratio: 1/1) { /* 세로 화면: 깨지지 않을 정도 */
  #call { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  #progress { display: none; }
  #choices.many { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<div id="app" data-era="title">

  <section id="title" class="screen">
    <div class="title-poster">
      <p class="title-kicker">역사로 탐구하는 현대 세계</p>
      <h1><span class="title-year">1968</span><span class="title-sub">세 도시의 학생</span></h1>
      <p class="title-cities"><b data-city="PA">파리</b><b data-city="PR">프라하</b><b data-city="MX">멕시코시티</b></p>
      <div class="title-buttons">
        <button id="btn-start" class="btn-poster">시작하기</button>
        <button id="btn-continue" class="btn-poster ghost" hidden>이어하기</button>
      </div>
      <p class="title-note">최소판 미리보기 · PA-I → PA-2 → PA-O</p>
      <label class="title-data" id="data-toggle" hidden><input type="checkbox" id="chk-example"> PA-2를 양식의 '예시' 시트 대사로 보기</label>
    </div>
  </section>

  <section id="play" class="screen" hidden>
    <header id="topbar">
      <span id="progress"></span>
      <span id="caption"></span>
      <span class="topbar-buttons">
        <button id="btn-log" type="button">지난 대사</button>
        <button id="btn-notebook" type="button">사료 수첩 <b id="nb-count">0</b></button>
      </span>
    </header>

    <div id="stage">
      <!-- 1968 장면 -->
      <div id="bg"><span id="bg-label"></span></div>
      <div id="chars"></div>
      <div id="inspect" hidden></div>
      <div id="choices" hidden></div>

      <!-- 2026 인터뷰 -->
      <div id="call" hidden>
        <div id="call-video">
          <span class="call-live">● 통화 중</span>
          <div id="call-face"></div>
          <span id="call-name"></span>
        </div>
        <div id="call-side">
          <div id="rec">
            <div id="wave" aria-hidden="true"></div>
            <span id="rec-label">녹음 중 <span id="rec-time">00:00</span></span>
          </div>
          <div id="questions"></div>
        </div>
      </div>
    </div>

    <div id="dialog" role="button" tabindex="0" aria-live="polite" aria-label="대사창. 눌러서 넘기기">
      <div id="speaker"></div>
      <p id="text"></p>
      <span id="more" aria-hidden="true">▼</span>
    </div>
  </section>

  <section id="end" class="screen" hidden>
    <div class="end-card">
      <h2>최소판은 여기까지입니다</h2>
      <p>아래는 방금 플레이에서 게임이 기억한 내용입니다. 이 기록이 뒤 장면 조건과 결과지로 이어집니다.</p>
      <div id="end-summary"></div>
      <button id="btn-home" class="btn-modern">처음으로</button>
    </div>
  </section>

  <div id="modal" hidden>
    <div id="modal-box" role="dialog" aria-modal="true"></div>
  </div>
  <div id="fx" aria-hidden="true"></div>

// ── engine.js ──
const { newState, condOk, ScenePlayer } = (() => {
// 장면 재생 논리: 조건, 플래그, 선택 기록. 화면(DOM)은 모른다.

function newState() {
  return { v: 1, pos: 0, name: '', flags: {}, choices: {}, reasons: {}, diary: {}, notebook: [], causes: {} };
}

function flagOn(v) {
  return v !== undefined && v !== null && v !== false;
}

// conds: [{choice:'A'} | {question:'Q1'} | {flag:'F_X'} | {flag:'F_X', not:true} | {flag:'F_X', eq:'B'}] 모두 만족(AND)
function condOk(conds, flags, local) {
  if (!conds) return true;
  return conds.every((c) => {
    if ('choice' in c) return local.choice === c.choice;
    if ('question' in c) return local.question === c.question;
    const v = flags[c.flag];
    if ('eq' in c) return String(v) === String(c.eq);
    return c.not ? !flagOn(v) : flagOn(v);
  });
}

class ScenePlayer {
  constructor(scene, state) {
    this.scene = scene;
    this.state = state;
    this.i = -1;
    this.local = { choice: null, question: null };
    state.choices[scene.id] = []; // 장면을 다시 하면 그 장면의 기록은 새로 쓴다
    delete state.reasons[scene.id];
  }

  // 조건에 맞는 다음 줄. 장면이 끝나면 null
  next() {
    const { lines } = this.scene;
    while (++this.i < lines.length) {
      if (condOk(lines[this.i].if, this.state.flags, this.local)) return lines[this.i];
    }
    return null;
  }

  pick(line, key) {
    const opt = line.options.find((o) => o.key === key);
    Object.assign(this.state.flags, opt.set || {});
    if (line.type === 'question') this.local.question = key;
    else if (!line.group) this.local.choice = key; // 묶음 선택(간직 등)은 '선택=A' 조건의 대상이 아니다
    this.state.choices[this.scene.id].push({ type: line.type, group: line.group || null, key, text: opt.text });
  }

  reason(tag) {
    this.state.reasons[this.scene.id] = tag;
  }

  collect(sourceId) {
    if (!this.state.notebook.includes(sourceId)) this.state.notebook.push(sourceId);
  }
}

return { newState, condOk, ScenePlayer };

}

function clearGame() {
  try {

  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'onclick') n.addEventListener('click', v);

    };
    closeModal = closable ? () => done() : null;
    if (closable) box.append(el('button', { class: 'modal-close', type: 'button', onclick: () => done() }, '닫기'));
    box.done = done;
    $('modal').hidden = false;
    (box.querySelector('button') || box).focus();
  });
}

function sourceCard(id) {
  const s = typeof id === 'string' ? sources[id] : id;
  if (!s) return el('div', { class: 'card' }, `[사료 ${id} 없음]`);
  const pending = !s.text;
  return el('article', { class: 'card' + (pending ? ' pending' : '') },
    el('div', { class: 'card-kicker' }, '사료', pending ? el('b', {}, '[확인 전]') : null),
    el('p', { class: 'card-text' }, s.text || s.candidate),
    s.desc ? el('p', { class: 'card-desc' }, s.desc) : null,
    el('p', { class: 'card-cite' }, s.cite ? `출처: ${s.cite}` : pending ? '사료 후보입니다. 원문과 출처를 확인한 뒤 본문이 들어갑니다.' : ''));
}

function showSource(line) {
  const card = sourceCard(line.sourceId || { candidate: line.inline, text: '' });
  const wrap = el('div', {}, card,
    el('button', { class: 'modal-ok', type: 'button', onclick: () => $('modal-box').done() }, line.sourceId ? '사료 수첩에 넣기' : '확인'));
  return openModal(wrap, { closable: false, kind: 'source' });
}

function showNotebook() {
  const list = el('div', { class: 'list' }, el('h2', {}, `사료 수첩 (${state.notebook.length})`));
  if (!state.notebook.length) list.append(el('p', { class: 'empty' }, '아직 모은 사료가 없습니다.'));
  for (const id of state.notebook) list.append(sourceCard(id));
  openModal(list, { kind: 'source' });
}

function showBacklog() {
  const list = el('div', { class: 'list' }, el('h2', {}, '지난 대사'));
  if (!backlog.length) list.append(el('p', { class: 'empty' }, '이 장면에서 지나간 대사가 없습니다.'));
  for (const b of backlog) list.append(el('p', { class: 'log' }, b.name ? el('b', {}, b.name) : null, b.text));
  openModal(list);
  list.lastElementChild.scrollIntoView();
}

function showReason(line) {
  const box = el('div', { class: 'reason' }, el('h2', {}, '왜 그렇게 했나요?'),
    el('div', { class: 'tags' }, ...line.tags.map((t) => el('button', { type: 'button', onclick: () => $('modal-box').done(t) }, t))));
  return openModal(box, { closable: false });
}

// ───────── 시대 전환, 배경, 인물 ─────────
async function setEra(next, scene) {
  const app = $('app');
  const flip = (era === '1968' || era === '2026') && era !== next;
  if (flip) { $('fx').className = 'noise'; await wait(350); }
  era = next;
  app.dataset.era = next;
  app.dataset.city = scene.city;
  for (const id of ['bg', 'chars']) $(id).hidden = next !== '1968';
  $('call').hidden = next !== '2026';
  if (next === '1968') setBg(scene.bg || scene.id, `${scene.id} ${scene.title}`);
  else {
    const elder = (meta.cities[scene.city] || {}).elder || '';
    $('call-name').textContent = elder;
    $('call-face').replaceChildren(silhouette(elder));
    const t0 = Date.now();
    clearInterval(recTimer);
    const tick = () => {
      const s = Math.floor((Date.now() - t0) / 1000);
      $('rec-time').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    };
    tick();
    recTimer = setInterval(tick, 1000);
  }
  if (flip) { await wait(350); $('fx').className = ''; }
}

function setBg(id, label) {
  const bg = $('bg');
  bg.style.backgroundImage = '';
  bg.dataset.v = [...id].reduce((a, c) => a + c.charCodeAt(0), 0) % 3; // 장면마다 구성이 조금 다르게
  $('bg-label').textContent = `배경 자리표시 · ${label || id}`;
  $('bg-label').hidden = false;
  tryImage(`assets/bg/${encodeURIComponent(id)}.webp`, (url) => {
    bg.style.backgroundImage = `url("${url}")`;
    $('bg-label').hidden = true;
  });
}

function silhouette(name) {
  const box = el('div', { class: 'sil' });
  box.innerHTML = '<svg viewBox="0 0 100 130" aria-hidden="true"><circle cx="50" cy="34" r="22"/><path d="M8 130c0-38 18-58 42-58s42 20 42 58z"/></svg>';
  tryImage(`assets/char/${encodeURIComponent(name)}.webp`, (url) => box.replaceChildren(el('img', { src: url, alt: '' })));
  return box;
}

function renderCast() {
  $('chars').replaceChildren(...cast.map((n) => el('div', { class: 'char', 'data-name': n }, silhouette(n), el('span', {}, n))));
}

function setSpeaking(name) {
  if (era === '2026') {
    $('call-video').classList.toggle('speaking', !!name && name !== '플레이어');
    return;
  }
  if (name && name !== '플레이어' && !cast.includes(name)) {
    cast.push(name);
    if (cast.length > 2) cast.shift();
    renderCast();
  }
  for (const c of $('chars').children) c.classList.toggle('speaking', c.dataset.name === name);
}

function direction(text) {
  const t = text.trim();
  let m;
  if (t === '암전') $('fx').className = 'dark';
  else if (t === '밝아짐') $('fx').className = '';
  else if (t === '화면 흔들림') {
    if (reduced) return;
    $('stage').classList.add('shake');
    setTimeout(() => $('stage').classList.remove('shake'), 450);
  } else if ((m = t.match(/^배경:\s*(.+)$/))) setBg(m[1].trim());
  else if ((m = t.match(/^인물:\s*(.+?)\s*(등장|퇴장)$/))) {
    cast = cast.filter((n) => n !== m[1]);
    if (m[2] === '등장') cast = [...cast, m[1]].slice(-2);
    renderCast();
  }
  // '효과음: …' 과 그 밖의 지시는 맞는 음원·처리가 없으면 조용히 건너뛴다
}

// ───────── 대사창 ─────────
function setDialog(kind, name, text, ph) {
  const d = $('dialog');
  d.dataset.kind = kind;
  d.classList.toggle('ph', !!ph);
  $('speaker').textContent = name;
  $('speaker').hidden = !name;
  $('text').textContent = text;
}

function showText(line) {
  return new Promise((resolve) => {
    const kind = line.type === 'say' ? 'say' : line.type === 'thought' ? 'thought' : 'narration';
    const name = kind === 'say' ? line.speaker || '[화자 미정]' : kind === 'thought' ? `${line.speaker || ''} 속마음`.trim() : line.speaker || '';
    setSpeaking(kind === 'say' ? line.speaker : null);
    setDialog(kind, name, '', line.ph);
    backlog.push({ name, text: line.text });
    const chars = [...line.text];
    let n = 0;
    let timer = null;
    $('more').hidden = true;
    const finish = () => {
      clearInterval(timer);
      timer = null;
      $('text').textContent = line.text;
      $('more').hidden = false;
    };
    advance = () => {
      if (timer) return finish(); // 글자가 나오는 중이면 한 번에 완성
      advance = null;
      resolve();
    };
    if (reduced) finish();
    else timer = setInterval(() => { $('text').textContent += chars[n++]; if (n >= chars.length) finish(); }, TYPE_MS);
  });
}

// ───────── 선택, 조사 ─────────
function showOptions(line) {
  return new Promise((resolve) => {
    const box = era === '2026' ? $('questions') : $('choices');
    $('more').hidden = true;
    setSpeaking(null);
    const buttons = line.options.map((o) => el('button', {
      type: 'button',
      onclick: () => { box.replaceChildren(); if (box.id === 'choices') box.hidden = true; resolve(o.key); },
    }, era === '2026' ? null : el('b', {}, o.key), o.text));
    box.className = line.options.length > 4 ? 'many' : '';
    box.replaceChildren(...(line.prompt ? [el('p', { class: 'prompt' }, line.prompt)] : []), ...buttons);
    box.hidden = false;
    buttons[0].focus();
  });
}

function showInspect(line) {
  return new Promise((resolve) => {
    const box = $('inspect');
    const seen = new Set();
    const n = line.spots.length;
    const head = el('p', { class: 'inspect-head' });
    const next = el('button', { class: 'inspect-next', type: 'button', onclick: () => { box.hidden = true; box.replaceChildren(); $('chars').hidden = false; resolve(); } }, '다음');
    const update = () => {
      head.textContent = `조사할 곳을 눌러 보세요 (${seen.size}/${n})`;
      next.classList.toggle('ready', seen.size === n);
    };
    const spots = line.spots.map((s, i) => {
      const x = n === 1 ? 50 : 14 + (72 * i) / (n - 1);
      const b = el('button', {
        class: 'spot', type: 'button', style: `left:${x}%;top:${i % 2 ? 34 : 58}%`,
        onclick: () => {
          seen.add(i);
          b.classList.add('seen');
          setDialog('narration', s.name, s.text, s.ph);
          backlog.push({ name: s.name, text: s.text });
          update();
        },
      }, s.name);
      return b;
    });
    const panels = line.layout === 'compare'
      ? el('div', { class: 'compare' }, el('div', {}, line.left || ''), el('div', {}, line.right || ''))
      : null;
    box.replaceChildren(...(panels ? [panels] : []), head, ...spots, next);
    $('chars').hidden = true;
    setDialog('narration', '', '', false);
    $('more').hidden = true;
    update();
    box.hidden = false;
    spots[0].focus();
  });
}

// ───────── 장면 재생 ─────────
async function playScene(scene, st, progress) {
  state = st;
  const p = new ScenePlayer(scene, state);
  backlog = [];
  cast = [];
  renderCast();
  setDialog('narration', '', '', false);
  $('more').hidden = true;
  $('caption').textContent = '';
  $('progress').textContent = progress;
  $('nb-count').textContent = state.notebook.length;
  $('inspect').hidden = true;
  $('choices').hidden = true;
  $('questions').replaceChildren();
  await setEra(scene.kind === 'interview' ? '2026' : '1968', scene);
  $('dialog').focus({ preventScroll: true });

  let line;
  while ((line = p.next())) {
    switch (line.type) {
      case 'caption': $('caption').textContent = line.text; break;
      case 'narration': case 'say': case 'thought': case 'result': await showText(line); break;
      case 'inspect': await showInspect(line); break;
      case 'source':
        if (line.sourceId) p.collect(line.sourceId);
        await showSource(line);
        $('nb-count').textContent = state.notebook.length;
        break;
      case 'choice': case 'question': p.pick(line, await showOptions(line)); break;
      case 'reason': p.reason(await showReason(line)); break;
      case 'direction': direction(line.text); break;
      default: break; // 일기 등 아직 화면이 없는 유형
    }
  }
  clearInterval(recTimer);
  $('fx').className = '';
}

return { show, initUI, playScene };
})();
// ── main.js ──
const {  } = (() => {

const $ = (id) => document.getElementById(id);

async function getJSON(name) {
  if (window.__DATA__) return window.__DATA__[name] || null; // 한 파일 미리보기판(tools/build_single.py)
  try {
    const r = await fetch(`data/${name}.json`);
    return r.ok ? await r.json() : null;
  } catch (e) {
    return null;
  }
}

async function boot() {
  const [meta, base, example, sources] = await Promise.all(['meta', 'scenes', 'scenes.example', 'sources'].map(getJSON));
  if (!meta || !base) {
    document.body.textContent = '데이터(data/meta.json, data/scenes.json)를 불러오지 못했습니다. README의 실행 방법을 확인해 주세요.';
    return;
  }
  initUI(meta, sources || {});
  const flow = meta.flow.minimal;

  async function run(state) {
    const scenes = (state.example && example ? example : base).scenes;
    show('play');
    for (let i = state.pos; i < flow.length; i++) {
      state.pos = i;
      saveGame(state); // 장면 시작마다 자동 저장
      const s = scenes[flow[i]];
      await playScene(s, state, `${meta.cities[s.city].name} · ${s.id} ${s.title} (${i + 1}/${flow.length})`);
    }
    state.pos = flow.length;
    saveGame(state);
    showEnd(state, scenes);
  }

  function showEnd(state, scenes) {
    const rows = flow.map((id) => {
      const picks = (state.choices[id] || []).map((c) => `${c.key}. ${c.text}`).join(' / ') || '-';
      return `<tr><th>${id}<br><small>${scenes[id].title}</small></th><td>${picks}</td><td>${state.reasons[id] || '-'}</td></tr>`;
    });
    const flags = Object.entries(state.flags).map(([k, v]) => (v === true ? k : `${k}=${v}`)).join(', ') || '없음';
    $('end-summary').innerHTML = `<table><tr><th>장면</th><th>고른 것</th><th>이유</th></tr>${rows.join('')}</table>
      <p><b>켜진 플래그</b> ${flags}</p><p><b>사료 수첩</b> ${state.notebook.length}장 (${state.notebook.join(', ') || '-'})</p>`;
    show('end');
  }

  function showTitle() {
    const saved = loadGame();
    $('btn-continue').hidden = !saved;
    $('data-toggle').hidden = !example;
    show('title');
    $('btn-start').focus();
  }

  $('btn-start').addEventListener('click', () => {
    clearGame();
    run({ ...newState(), example: $('chk-example').checked });
  });
  $('btn-continue').addEventListener('click', () => {
    const saved = loadGame();
    if (saved) run(saved);
  });
  $('btn-home').addEventListener('click', showTitle);
  showTitle();
}

boot();

return {  };
})();
})();
</script>
